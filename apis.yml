aid: datasaur
name: Datasaur
description: >-
  Datasaur is an enterprise AI lab that builds private, secure LLM and data
  solutions deployed on a customer's own infrastructure. Its Data Studio is a
  collaborative data-labeling platform (span, row, document, bounding-box,
  conversational and audio tasks) with ML-assisted labeling, while LLM Labs
  covers sandboxing, deployment, knowledge bases, model integrations and
  evaluation. Products include an enterprise chatbot, document intelligence,
  PII/PHI redaction and private agents, serving legal, healthcare, finance,
  insurance, eCommerce and government. Developers integrate through a GraphQL
  API (OAuth2 client credentials) at app.datasaur.ai/graphql, the Robosaur CLI,
  webhooks, and SAML/SCIM for workspace SSO.
